[package]
name = "conver"
version = "1.7.0"
edition = "2024"
description = "Conver - conversor universal"

[dependencies]
ar-reshaper = "1.5"
arboard = "3"
color_quant = "1.1"
eframe = "0.31"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "rayon"] }
kamadak-exif = "0.6.1"
lopdf = "0.46.0"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "api-17"] }
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rayon = "1"
realfft = "3"
rfd = "0.15"
rust_xlsxwriter = { version = "0.102", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-winrt-notification = "0.8.1"
unicode-bidi = "0.3.18"
ureq = { version = "2", features = ["native-certs"] }  # certificados do Windows: antivírus que inspecionam HTTPS (Kaspersky, Avast…) põem o próprio certificado lá
webp = { version = "0.3", default-features = false }
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Data_Pdf", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Security_Cryptography"] }
winreg = "0.56.0"

[[bin]]
name = "conver"
path = "src/main.rs"

[[bin]]
name = "conver-cli"
path = "src/bin/conver-cli.rs"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
