[package]
name = "conver"
version = "1.0.0"
edition = "2024"
description = "Conver - conversor universal"

[dependencies]
arboard = "3"
color_quant = "1.1"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico", "rayon"] }
kamadak-exif = "0.6.1"
lopdf = "0.46.0"
png = "0.17"
qrcode = { version = "0.14", default-features = false }
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.8.1"
ureq = "2"
webp = { version = "0.3", default-features = false }
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_System_WinRT"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
